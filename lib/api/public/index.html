<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEGA SDK — 管理後臺</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>VEGA SDK &mdash; 管理後臺</h1>
  <span id="status">載入中…</span>
</header>
<nav class="tabs">
  <button class="tab-btn active" data-tab="config"   onclick="switchTab('config')">Config Map</button>
  <button class="tab-btn"        data-tab="settings" onclick="switchTab('settings')">設定</button>
  <button class="tab-btn"        data-tab="logic"    onclick="switchTab('logic')">設備邏輯</button>
</nav>

<main>
<div id="tab-config" class="tab-panel active">
  <div class="toolbar">
    <button class="btn-primary" onclick="openAddModal()">＋ 新增裝置</button>
    <button class="btn-success" onclick="saveConfig()">儲存設定</button>
  </div>

  <div id="device-list"></div>
  <div id="empty-state">尚無裝置設定，點擊「新增裝置」開始新增。</div>
</div>

<div id="tab-settings" class="tab-panel">
  <div class="card" style="max-width:520px;margin:24px auto;">
    <div class="card-header"><span class="topic-label">連線設定</span></div>
    <div class="card-body">
      <div class="form-group">
        <label>MQTT Broker URL</label>
        <input id="s-mqttUrl" type="text" placeholder="mqtt://host:1883" />
      </div>
      <div class="form-group">
        <label>MQTT 使用者名稱</label>
        <input id="s-mqttUsername" type="text" />
      </div>
      <div class="form-group">
        <label>MQTT 密碼</label>
        <div style="display:flex;gap:8px;">
          <input id="s-mqttPassword" type="password" style="flex:1;" />
          <button class="btn-ghost" style="padding:7px 12px;white-space:nowrap;" onclick="togglePassword()">顯示</button>
        </div>
      </div>
      <div class="form-group">
        <label>Modbus Port</label>
        <input id="s-modbusPort" type="number" min="1" max="65535" />
      </div>
      <div class="error-msg" id="settings-error"></div>
      <div style="margin-top:20px;">
        <button class="btn-success" onclick="saveSettings()">儲存並重啟</button>
      </div>
    </div>
  </div>
</div>

<div id="tab-logic" class="tab-panel">
  <div style="max-width:980px;margin:0 auto;">
    <div class="toolbar" style="align-items:center;flex-wrap:wrap;">
      <label style="font-size:0.875rem;font-weight:600;white-space:nowrap;">設備類型：</label>
      <select id="logic-device-select" style="width:auto;" onchange="switchLogicDevice(parseInt(this.value))"></select>
      <button class="btn-ghost" onclick="addLogicDevice()">＋ 新增設備</button>
      <button class="btn-danger" onclick="deleteLogicDevice()">刪除此設備</button>
      <div style="flex:1;"></div>
      <button class="btn-success" onclick="saveDeviceLogic()">儲存</button>
    </div>
    <div id="logic-error" style="font-size:0.8rem;min-height:1.4em;margin-bottom:8px;"></div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-body" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
        <div style="display:flex;gap:8px;align-items:center;">
          <label style="font-size:0.8rem;font-weight:600;">deviceType</label>
          <input id="ld-type" style="width:150px;" onblur="updateDeviceMeta()" />
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="ld-readonly" onchange="updateDeviceMeta()" />
          <label for="ld-readonly" style="font-size:0.8rem;font-weight:600;cursor:pointer;">readOnly</label>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <label style="font-size:0.8rem;font-weight:600;">未列欄位預設 read</label>
          <select id="ld-default-transform" onchange="updateDeviceMeta()">
            <option value="">(無)</option>
            <option value="passthrough">passthrough</option>
            <option value="boolean_to_int">boolean_to_int</option>
            <option value="skip">skip</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="topic-label">欄位轉換規則</span>
        <button class="btn-ghost" style="font-size:0.8rem;padding:5px 12px;" onclick="addLogicField()">＋ 新增欄位</button>
      </div>
      <div style="overflow-x:auto;">
        <div style="min-width:700px;">
          <div style="display:grid;grid-template-columns:150px 1fr 1fr 40px;gap:0;background:#f5f5f5;
                      font-size:0.75rem;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.4px;">
            <div style="padding:8px 14px;border-bottom:1px solid #e0e0e0;">欄位名稱</div>
            <div style="padding:8px 14px;border-bottom:1px solid #e0e0e0;">Read 轉換</div>
            <div style="padding:8px 14px;border-bottom:1px solid #e0e0e0;">Write 轉換</div>
            <div style="border-bottom:1px solid #e0e0e0;"></div>
          </div>
          <div id="logic-fields-body"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <div class="reconnect-overlay hidden" id="reconnect-overlay">
    <div class="spinner"></div>
    <div id="reconnect-msg">設定已儲存，服務重新啟動中…</div>
  </div>

</main>

<!-- Add Device Modal -->
<div class="modal-backdrop" id="add-modal">
  <div class="modal">
    <h2>新增裝置</h2>
    <div class="form-group">
      <label>MQTT Topic</label>
      <input id="new-topic" placeholder="例：test/GW/DK1" />
    </div>
    <div class="form-group">
      <label>裝置類型</label>
      <select id="new-type"></select>
    </div>
    <div class="error-msg" id="add-error"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddModal()">取消</button>
      <button class="btn-primary" onclick="confirmAdd()">新增</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>

</body>
</html>
