version: "3.8"

services:
  vega-sdk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vega-sdk
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "502:502"
      - "8080:8080"
    environment:
      - NODE_ENV=production
    volumes:
      # 掛載配置目錄
      - ./configs:/app/configs
      # 掛載生產環境日誌目錄
      - ./logs/prod:/app/logs/prod
      # 掛載開發環境日誌目錄（可選）
      - ./logs/dev:/app/logs/dev
    networks:
      - vega-network

networks:
  vega-network:
    driver: bridge

volumes:
  vega-data:
    driver: local
