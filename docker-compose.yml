version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vega-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - vega-network

  vega-sdk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vega-sdk
    restart: unless-stopped
    init: true
    depends_on:
      - mosquitto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MODBUS_PORT:-502}:${MODBUS_PORT:-502}"
      - "${UI_PORT:-18080}:${UI_PORT:-18080}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # 掛載配置目錄
      - ./configs:/app/configs
      # 掛載生產環境日誌目錄
      - ./logs/prod:/app/logs/prod
      # 掛載開發環境日誌目錄（可選）
      - ./logs/dev:/app/logs/dev
    networks:
      - vega-network

networks:
  vega-network:
    driver: bridge

volumes:
  vega-data:
    driver: local
  mosquitto-data:
    driver: local
